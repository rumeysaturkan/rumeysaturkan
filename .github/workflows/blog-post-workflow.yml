name: Latest Medium posts
on:
  schedule:
    - cron: "0 6 * * *"   # her gün bir kez çalışır
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@rumeysaturkan16"
          max_post_count: 5
